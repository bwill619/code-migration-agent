# Managed by the dev-maintenance hub.
#
# Updates are grouped into one PR per ecosystem per week. Auth, database,
# payment and framework packages are held back from major bumps, because a
# major there is a migration that wants a person reading it.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-deps:
        patterns: ["*"]
